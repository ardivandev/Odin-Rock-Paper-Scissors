<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Rock Paper Scissors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: 'Google Sans', sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
      }

      h1,
      p {
        text-align: center;
      }

      .author {
        font-size: 13px;
      }

      .playBox {
        font-size: 14px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Rock Paper Scissors</h1>
      <div class="playBox">
        <div class="buttons">
          <button type="button" data-choice="rock">Rock</button>
          <button type="button" data-choice="paper">Paper</button>
          <button type="button" data-choice="scissors">Scissors</button>
        </div>
        <p id="result" aria-live="polite"></p>
        <p>Human Score: <span id="human-score">0</span></p>
        <p>Computer Score: <span id="computer-score">0</span></p>
      </div>
      <p class="author">By Ardivan Nur Raihan Rahman | The Odin Project</p>
      <script src="script.js"></script>
    </div>
  </body>
</html>
